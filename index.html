<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publications — Ajitesh Srivastava</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="pubs">
  <div class="pubs-head">
    <h1>Publications</h1>
  </div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search title, author, venue" aria-label="Search publications">
    <select id="type" aria-label="Type"><option value="">All types</option></select>
    <select id="year" aria-label="Year"><option value="">All years</option></select>
    <select id="group" aria-label="Group by">
      <option value="category">By theme</option>
      <option value="year">By year</option>
      <option value="type">By type</option>
    </select>
  </div>
  <div class="chips" id="cats" aria-label="Themes"></div>
  <div class="chips" id="kws" aria-label="Keywords"></div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>
<script src="assets/common.js"></script>
<script>
(async function () {
  const K = window.CVKit;
  const params = new URLSearchParams(location.search);
  if (params.get("embed") === "1") document.body.classList.add("embed");
  const $ = (id) => document.getElementById(id);
  let data;
  try { data = await K.loadJSON("data/pubs.json"); }
  catch (e) { $("list").innerHTML = '<p class="empty">' + K.esc(e.message) + "</p>"; return; }

  const pubs = data.publications;
  const hl = (data.owner && data.owner.highlight) || [];
  const state = {
    q: params.get("q") || "",
    cat: params.get("category") || "",
    kw: params.get("keyword") || "",
    type: params.get("type") || "",
    year: params.get("year") || "",
    group: params.get("group") || "category",
  };

  (data.types || []).forEach((t) => { if (pubs.some((p) => p.type === t)) $("type").add(new Option(K.TYPE_LABELS[t] || t, t)); });
  Array.from(new Set(pubs.map((p) => p.year))).sort((a, b) => b - a).forEach((y) => $("year").add(new Option(y, y)));
  $("q").value = state.q; $("type").value = state.type; $("year").value = String(state.year); $("group").value = state.group;

  function matches(p, skip) {
    if (skip !== "cat" && state.cat && p.category !== state.cat) return false;
    if (skip !== "kw" && state.kw && !(p.keywords || []).includes(state.kw)) return false;
    if (state.type && p.type !== state.type) return false;
    if (state.year && String(p.year) !== String(state.year)) return false;
    if (state.q) {
      const hay = [p.title, p.venue, (p.authors || []).join(" "), (p.keywords || []).join(" "), p.award, p.year].join(" ").toLowerCase();
      if (!state.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  }

  function chips(el, items, current, onPick) {
    el.innerHTML = "";
    const all = document.createElement("button");
    all.className = "chip"; all.type = "button"; all.textContent = el.id === "cats" ? "All themes" : "All keywords";
    all.setAttribute("aria-pressed", String(!current)); all.onclick = () => onPick("");
    el.appendChild(all);
    items.forEach(([name, n]) => {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.setAttribute("aria-pressed", String(current === name));
      b.innerHTML = K.esc(name) + '<span class="n">' + n + "</span>";
      b.onclick = () => onPick(current === name ? "" : name);
      el.appendChild(b);
    });
  }

  function pubHTML(p) {
    const title = p.url ? '<a href="' + K.esc(p.url) + '" target="_blank" rel="noopener">' + K.esc(p.title) + "</a>" : K.esc(p.title);
    const plain = p.type === "preprint" || p.type === "thesis";
    const status = p.status && p.status !== "published" ? '<span class="badge">' + K.esc(p.status === "accepted" ? "to appear" : p.status) + "</span>" : "";
    const award = p.award ? '<span class="award">' + K.esc(p.award) + "</span>" : "";
    const tags = (p.keywords || []).map((k) => '<button type="button" class="tag" data-kw="' + K.esc(k) + '">' + K.esc(k) + "</button>").join("");
    return '<article class="pub"><div class="pub-title">' + title + "</div>" +
      '<div class="pub-authors">' + K.fmtAuthors(p.authors, hl, "html") + "</div>" +
      '<div class="pub-venue">' + (plain ? K.esc(p.venue) : "<em>" + K.esc(p.venue) + "</em>") + ", " + p.year + status + award + "</div>" +
      (tags ? '<div class="pub-tags">' + tags + "</div>" : "") + "</article>";
  }

  function render() {
    const catCounts = new Map();
    pubs.filter((p) => matches(p, "cat")).forEach((p) => catCounts.set(p.category, (catCounts.get(p.category) || 0) + 1));
    chips($("cats"), (data.categories || []).filter((c) => catCounts.has(c) || c === state.cat).map((c) => [c, catCounts.get(c) || 0]), state.cat, (v) => { state.cat = v; render(); });
    const kwItems = K.allKeywords(pubs.filter((p) => matches(p, "kw")));
    chips($("kws"), kwItems.slice(0, 24), state.kw, (v) => { state.kw = v; render(); });

    const shown = pubs.filter((p) => matches(p));
    $("count").textContent = shown.length + " of " + pubs.length + " publications";
    const groups = K.groupPubs(Object.assign({}, data, { publications: shown }), state.group, "newest");
    $("list").innerHTML = shown.length
      ? groups.map((g) => '<section class="group"><h2>' + K.esc(g.title) + "</h2>" + g.items.map(pubHTML).join("") + "</section>").join("")
      : '<p class="empty">No publications match these filters.</p>';
    $("list").querySelectorAll(".tag").forEach((t) => (t.onclick = () => { state.kw = t.dataset.kw; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }));
  }

  $("q").oninput = (e) => { state.q = e.target.value.trim(); render(); };
  $("type").onchange = (e) => { state.type = e.target.value; render(); };
  $("year").onchange = (e) => { state.year = e.target.value; render(); };
  $("group").onchange = (e) => { state.group = e.target.value; render(); };
  render();
})();
</script>
</body>
</html>
